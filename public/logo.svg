<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <!-- Outer rounded rectangle -->
  <rect x="8" y="8" width="104" height="104" rx="16" stroke="currentColor" stroke-width="2" fill="none"/>
  
  <!-- Top row -->
  <circle cx="32" cy="38" r="8" stroke="currentColor" stroke-width="2" fill="none"/>
  <line x1="40" y1="38" x2="56" y2="38" stroke="currentColor" stroke-width="2"/>
  <rect x="56" y="30" width="28" height="16" rx="4" stroke="currentColor" stroke-width="2" fill="none"/>
  <circle cx="70" cy="38" r="3" fill="currentColor"/>
  
  <!-- Dashed separator -->
  <line x1="24" y1="60" x2="96" y2="60" stroke="currentColor" stroke-width="1.5" stroke-dasharray="4 4"/>
  
  <!-- Bottom row -->
  <circle cx="32" cy="82" r="8" stroke="currentColor" stroke-width="2" fill="none"/>
  <line x1="40" y1="82" x2="56" y2="82" stroke="currentColor" stroke-width="2"/>
  <rect x="56" y="74" width="28" height="16" rx="4" stroke="currentColor" stroke-width="2" fill="none"/>
  <circle cx="70" cy="82" r="3" fill="currentColor"/>
